<!doctype html>
<html lang="en" data-style="classic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d2412">
  <title>INFINITE MONKEY INDUSTRIES</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Infinite Monkey">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@400;600&family=Barlow+Condensed:wght@500;700&family=Rokkitt:wght@500;800&family=Bree+Serif&family=Pacifico&display=swap" rel="stylesheet">
  <script>document.documentElement.dataset.screen = location.hash === '#play' ? 'game' : 'menu';</script>
  <script src="awards-catalogue.js"></script>
<script src="vault.js"></script>
<script src="vault-play.js"></script>
<script src="vault-save-gate.js"></script>
  <script src="rewards.js"></script>
  
  <script>if (!VaultSaveGate.blocked && !Rewards.enabled) document.write('<script src="style-swap.js"><\/script>');</script>
  <link rel="stylesheet" href="classic.css">
  <link rel="stylesheet" href="ops.css">
  <link rel="stylesheet" href="commission-board.css">
<link rel="stylesheet" href="hall.css">
<link rel="stylesheet" href="seasons.css">
  <link rel="stylesheet" href="minigame-progression.css">
<link rel="stylesheet" href="automation.css">
<link rel="stylesheet" href="production-goal.css">
  <link rel="stylesheet" href="pickups.css">
  <link rel="stylesheet" href="classic-fx.css">
</head>
<body>
  <!-- Parallax jungle backdrop -->
  <div class="backdrop" aria-hidden="true">
    <div class="layer layer-far"></div>
    <div class="layer layer-mid"></div>
    <div class="layer layer-near"></div>
    <div class="drifters" id="drifters"></div>
    <div class="night-sky" id="night"><div class="fireflies" id="fireflies"></div></div>
    <svg class="foliage foliage-l" viewBox="0 0 240 240" aria-hidden="true"><use href="#fronds"/></svg>
    <svg class="foliage foliage-r" viewBox="0 0 240 240" aria-hidden="true"><use href="#fronds"/></svg>
  </div>

  <!-- MENU: the title screen. Play drops you into the game. -->
  <main class="screen menu" id="menu">
    <div class="hero-rays" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="hero-motes" id="heroMotes" aria-hidden="true"></div>
    <div class="hero-monkey" id="heroMonkey" aria-hidden="true">
      <div class="hm-vine"></div>
      <div class="hm-bubble" id="hmBubble">OOH OOH!</div>
      <svg viewBox="0 0 80 110">
        <g class="m-tail"><path d="M48 80 C70 82 74 98 62 102 C56 104 54 98 60 96" fill="none" stroke="#6b4423" stroke-width="5" stroke-linecap="round"/></g>
        <g class="m-leg-l"><ellipse cx="33" cy="94" rx="6" ry="11" fill="#6b4423"/><ellipse cx="33" cy="104" rx="6" ry="3.5" fill="#d9a066"/></g>
        <g class="m-leg-r"><ellipse cx="47" cy="94" rx="6" ry="11" fill="#6b4423"/><ellipse cx="47" cy="104" rx="6" ry="3.5" fill="#d9a066"/></g>
        <ellipse cx="40" cy="68" rx="15" ry="22" fill="#7a4a21"/>
        <ellipse cx="40" cy="72" rx="9" ry="14" fill="#e8c08a"/>
        <path class="m-arm-l" d="M29 52 Q14 34 34 9" fill="none" stroke="#7a4a21" stroke-width="7" stroke-linecap="round"/>
        <path class="m-arm-r" d="M51 52 Q66 34 46 9" fill="none" stroke="#7a4a21" stroke-width="7" stroke-linecap="round"/>
        <circle cx="34" cy="8" r="5" fill="#5a3517"/><circle cx="46" cy="8" r="5" fill="#5a3517"/>
        <circle cx="22" cy="40" r="7" fill="#7a4a21"/><circle cx="22" cy="40" r="3.5" fill="#e8c08a"/>
        <circle cx="58" cy="40" r="7" fill="#7a4a21"/><circle cx="58" cy="40" r="3.5" fill="#e8c08a"/>
        <circle cx="40" cy="40" r="17" fill="#7a4a21"/>
        <ellipse cx="40" cy="44" rx="12" ry="11" fill="#f0cf9c"/>
        <g class="m-eyes"><g class="m-pupil"><circle cx="34" cy="39" r="2.6" fill="#1b1008"/><circle cx="34.8" cy="38.2" r=".8" fill="#fff"/></g>
          <g class="m-pupil"><circle cx="46" cy="39" r="2.6" fill="#1b1008"/><circle cx="46.8" cy="38.2" r=".8" fill="#fff"/></g></g>
        <ellipse cx="40" cy="45" rx="2.6" ry="1.8" fill="#6b3d1b"/>
        <ellipse class="m-mouth-open" cx="40" cy="51" rx="4.5" ry="5" fill="#5a1a10"/>
        <path class="m-smile" d="M34 49 Q40 54 46 49" fill="none" stroke="#6b3d1b" stroke-width="1.8" stroke-linecap="round"/>
        <g class="m-hat"><path d="M18 32 C20 10 60 10 62 32 C52 25 28 25 18 32Z" fill="#3a8a2e" stroke="#1f5a24" stroke-width="2" stroke-linejoin="round"/><path d="M40 14 L40 27 M40 19 L31 25 M40 19 L49 25" stroke="#7cc34a" stroke-width="2" stroke-linecap="round" fill="none"/></g>
      </svg>
    </div>
    <h1 class="title" id="title" aria-label="Infinite Monkey Industries">
      <span class="word" data-text="INFINITE"></span>
      <span class="word" data-text="MONKEY"></span>
      <span class="word" data-text="INDUSTRIES"></span>
    </h1>
    <p class="tagline">Typing Shakespeare since before it was cool.</p>
    <div class="hero-live" id="heroLive" hidden></div>
    <div class="menu-actions">
      <a class="banana-btn" id="playBtn" href="#play"><span id="playLabel" data-new="Play" data-cont="Continue">Play</span></a>
      <a class="banana-btn banana-btn-green" href="library.html"><span>Library</span></a>
    </div>
    <div class="menu-corner">
      <button class="toy" data-sound type="button" aria-label="Toggle sound effects" title="Sound on/off"><span class="toy-art"></span></button>
      <button class="leaf-link style-swap" id="styleSwap" type="button" title="Switch to the pixel-art style">Pixel Mode</button>
    </div>
    <p class="secret">psst… try typing “banana”.</p>
  </main>

  <!-- GAME: Typewriter Ops. Everything inside #opsRoot is built by ops.js -->
  <div class="screen game" id="game">
    <aside class="rail" id="rail" aria-label="Menu">
      <div class="rail-in" id="railIn">
        <button class="rail-toggle" id="railToggle" type="button" aria-label="Open the menu" aria-expanded="false" aria-controls="railDrawer"><i class="rail-chev"></i></button>
        <div class="hud" id="hud" title="Bananas">
          <svg viewBox="0 0 40 40" width="26" height="26" aria-hidden="true"><use href="#banana-icon"/></svg>
          <b id="score">0</b>
        </div>
        <nav class="o-tabs" id="oTabs" role="tablist" aria-label="Departments"></nav>
        <div class="rail-drawer" id="railDrawer">
          <div class="toys" id="toyDock"></div>
          <button class="toy" id="settingsBtn" type="button" aria-label="Settings" title="Settings" aria-haspopup="dialog" aria-expanded="false"><span class="toy-art">⚙️</span><em class="rail-lab">Settings</em></button>
          <button class="back-btn" id="menuBtn" type="button" aria-label="Back to the title screen" title="Title screen (Esc)"><span class="rail-arrow">‹</span><em class="rail-lab">Title screen</em></button>
        </div>
      </div>
    </aside>
    <div id="opsRoot"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- Shared symbols -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="fronds" viewBox="0 0 240 240">
      <g fill="#2f8a2e" stroke="#16501a" stroke-width="3" stroke-linejoin="round">
        <path class="fr f1" d="M0 240 C30 150 90 90 200 70 C150 110 110 160 90 240Z"/>
        <path class="fr f2" d="M0 240 C10 170 40 110 110 40 C100 100 80 170 60 240Z" fill="#3a9c35"/>
        <path class="fr f3" d="M0 240 C60 200 120 190 235 200 C150 230 90 240 40 240Z" fill="#276f26"/>
      </g>
      <g fill="none" stroke="#16501a" stroke-width="2" opacity=".6"><path d="M0 240 C60 160 120 110 200 70"/><path d="M0 240 C20 170 60 100 110 40"/></g>
    </symbol>
    <symbol id="banana-icon" viewBox="0 0 40 40">
      <path d="M8 8 C6 22 14 34 32 34 C34 34 35 31 33 30 C20 28 16 18 16 8 Z" fill="#ffd93b" stroke="#a8740f" stroke-width="2" stroke-linejoin="round"/>
      <rect x="8" y="5" width="8" height="5" rx="1.5" fill="#6b4423"/>
    </symbol>
  </svg>

  <script>
    if (!VaultSaveGate.blocked && Rewards.enabled) Rewards.start(() => {
      localStorage.setItem('imi-style', 'classic');
      document.getElementById('styleSwap').addEventListener('click', () => { if (Rewards.owns()) location.href = 'index.html' + location.search + location.hash; });
    });
  </script>
  <script src="weather.js"></script>
  <script src="world.js"></script>
  <script src="mood.js"></script>
  <script src="economy.js"></script>
  <script src="core.js"></script>
  <script src="classic.js"></script>
  <script src="readers.js"></script>
  <script src="readers-kids.js"></script>
  <script src="readers-w5.js"></script>
  <script src="readers-w7.js"></script>
  <script src="readers-w9.js"></script>
  <script src="crew-art.js"></script>
  <script src="crew-svg.js"></script>
  <script src="minigame-progression.js"></script>
<script src="auto-challenge.js"></script>
<script src="automation.js"></script>
  <script src="production-goal.js"></script>
<script src="training-pool.js"></script>
<script src="folio.js"></script>
<link rel="stylesheet" href="layers.css">
<script src="layers.js"></script>
<script src="estate.js"></script>
<script src="archive.js"></script>
<script src="works.js"></script>
  <script src="works-catalogue.js"></script>
<script src="works-play.js"></script>
<script src="commission-board.js"></script>
<script src="hall.js"></script>
<script src="seasons.js"></script>
<script src="ops.js"></script>
  <script src="tour.js"></script>
  <script src="pickups.js"></script>
  <script src="classic-fx.js"></script>
  <script src="pwa.js" defer></script>
</body>
</html>
