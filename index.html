<html lang="en" data-style="pixel">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a2a1c">
  <title>INFINITE MONKEY INDUSTRIES</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Infinite Monkey">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Pixelify+Sans:wght@400;700&family=Silkscreen&family=Tiny5&family=Jersey+10&family=Micro+5&display=swap" rel="stylesheet">
  <script>document.documentElement.dataset.screen = location.hash === '#play' ? 'game' : 'menu';</script>
  <script src="game-features.js"></script>
<script src="awards-catalogue.js"></script>
<script src="vault.js"></script>
<script src="vault-play.js"></script>
<script src="vault-save-gate.js"></script>

  <link rel="stylesheet" href="ops.css">
  <link rel="stylesheet" href="gems.css">
  <link rel="stylesheet" href="juice.css">
  <link rel="stylesheet" href="longgame-fx.css">
  <link rel="stylesheet" href="commission-board.css">
<link rel="stylesheet" href="hall.css">
<link rel="stylesheet" href="seasons.css">
  <link rel="stylesheet" href="minigame-progression.css">
<link rel="stylesheet" href="automation.css">
<link rel="stylesheet" href="production-goal.css">
  <link rel="stylesheet" href="pickups.css">
  <link rel="stylesheet" href="pixel-fx.css">
  <link rel="stylesheet" href="story.css">
</head>
<body>
  <!-- Pixel jungle backdrop (all art generated in pixel.js) -->
  <div class="backdrop" aria-hidden="true">
    <div class="sky" id="sky"></div>
    <div class="layer layer-far"></div>
    <div class="layer layer-mid"></div>
    <div class="layer layer-near"></div>
    <div class="drifters" id="drifters"></div>
    <div class="night-sky" id="nightSky">
      <div class="stars" id="starsA"></div><div class="stars alt" id="starsB"></div>
      <div class="moon spr" data-spr="moon" data-mult="2"></div>
      <div class="fireflies" id="fireflies"></div>
    </div>
  </div>

  <!-- MENU: the title screen. A living StoryKit diorama of the player's building (app.js); PLAY dives into the founder's typewriter. -->
  <main class="screen menu intro" id="menu">
    <canvas class="ti-cv" id="titleCv" aria-hidden="true"></canvas>
    <div class="ti-shade" aria-hidden="true"></div>
    <div class="ti-top" id="tiTop">
      <h1 class="title" id="title" aria-label="Infinite Monkey Industries">
        <span class="tl-row"><span class="word" data-text="INFINITE"></span><span class="word" data-text="MONKEY"></span></span>
        <span class="tl-row"><span class="word" data-text="INDUSTRIES"></span></span>
      </h1>
      <p class="tagline">Typing Shakespeare since before it was cool.</p>
    </div>
    <div class="hm-bubble" id="hmBubble" aria-hidden="true">OOH OOH!</div>
    <div class="ti-bot" id="tiBot">
      <div class="ti-panel" id="storyPanel" role="dialog" aria-labelledby="storyHead" hidden>
        <div class="ti-phead"><b id="storyHead">The story so far</b><button class="ti-px" type="button" aria-label="Close">X</button></div>
        <ol class="ti-plist"></ol>
      </div>
      <nav class="ti-nav" aria-label="Main menu">
        <a class="banana-btn ti-play" id="playBtn" href="#play"><span class="ti-plab" id="playLabel" data-new="PLAY" data-cont="CONTINUE">PLAY</span><small class="ti-chap" id="playChapter">Prologue: The Clearing</small></a>
        <button class="ti-btn" id="storyBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="storyPanel" hidden>STORY</button>
      </nav>
      <div class="hero-live" id="heroLive" hidden></div>
      <p class="secret">psst... try typing "banana".</p>
    </div>
    <p class="ti-skip" aria-hidden="true"><span class="ti-fine">CLICK OR PRESS ANY KEY TO SKIP</span><span class="ti-coarse">TAP TO SKIP</span></p>
    <div class="menu-corner">
      <button class="toy" id="menuSettings" type="button" aria-label="Settings" title="Settings" aria-haspopup="dialog" aria-expanded="false"><span class="toy-art"><i class="gear-bars"><b></b><b></b><b></b></i></span></button>
    </div>
  </main>

  <!-- GATE: press any key before the opening (the press is the gesture that lets the audio start). Shown by app.js on the first title visit of a page load. -->
  <button class="gate" id="gate" type="button" hidden aria-label="Press any key to start. Infinite Monkey Industries presents.">
    <canvas class="gate-cv" id="gateCv" aria-hidden="true"></canvas>
    <span class="gate-pre" aria-hidden="true">INFINITE MONKEY INDUSTRIES<br>PRESENTS</span>
    <span class="gate-cta" aria-hidden="true"><span class="gate-fine">PRESS ANY KEY</span><span class="gate-coarse">TAP TO START</span></span>
  </button>

  <!-- GAME: Typewriter Ops. Everything inside #opsRoot is built by ops.js -->
  <div class="screen game" id="game">
    <aside class="rail" id="rail" aria-label="Menu">
      <div class="rail-in" id="railIn">
        <button class="rail-toggle" id="railToggle" type="button" aria-label="Open the menu" aria-expanded="false" aria-controls="railDrawer"><i class="rail-chev"></i></button>
        <div class="hud" id="hud" title="Bananas">
          <span class="spr" data-spr="banana"></span><b id="score">0</b>
        </div>
        <nav class="o-tabs" id="oTabs" role="tablist" aria-label="Departments"></nav>
        <div class="rail-drawer" id="railDrawer">
          <div class="toys" id="toyDock"></div>
          <button class="toy" id="settingsBtn" type="button" aria-label="Settings" title="Settings" aria-haspopup="dialog" aria-expanded="false"><span class="toy-art"><i class="gear-bars"><b></b><b></b><b></b></i></span><em class="rail-lab">Settings</em></button>
          <button class="back-btn" id="menuBtn" type="button" aria-label="Back to the title screen" title="Title screen (Esc)"><span class="rail-arrow">&lt;</span><em class="rail-lab">Title screen</em></button>
        </div>
      </div>
    </aside>
    <div id="opsRoot"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script>
    if (!VaultSaveGate.blocked && Rewards.enabled) Rewards.start(() => {
      try { localStorage.removeItem('imi-style'); } catch (e) { /* the retired art-style preference: nothing reads it any more */ }
    });
  </script>
  <script src="pixel.js"></script>
  <script src="crew-art.js"></script>
  <script src="muse-art.js"></script>

  <script src="economy.js"></script>
  <script src="core.js"></script>

  <script src="juice.js"></script>
  <script src="app.js"></script>
  <script src="readers.js"></script>
  <script src="readers-kids.js"></script>
  <script src="readers-w5.js"></script>
  <script src="readers-w7.js"></script>
  <script src="readers-w9.js"></script>

<script src="auto-challenge.js"></script>
<script src="automation.js"></script>

<script src="training-pool.js"></script>
<script src="folio.js"></script>

<script src="layers.js"></script>

<script src="archive.js"></script>
<script src="works.js"></script>
  <script src="works-catalogue.js"></script>
<script src="works-play.js"></script>
<script src="commission-board.js"></script>
<script src="hall.js"></script>
<script src="seasons.js"></script>

<script src="foreman.js"></script>
<script src="longgame-fx.js"></script>

<script src="house.js"></script>
<script src="house-ui.js"></script>
